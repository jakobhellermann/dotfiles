"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[user]
name = "Jakob Hellermann"
email = "jakob.hellermann@protonmail.com"

[snapshot]
max-new-file-size = "10MiB"

[ui]
default-command = "log"
# color = "always"
conflict-marker-style = "git"
movement.edit = true

editor = "nvim"
diff-editor = "diffpatch"
merge-editor = "vscode"
pager = "less -FRX --wordwrap"
# pager = "less -FRXS --wordwrap"

[git]
private-commits = "private"
fetch = ["*"]

[revsets]
log-graph-prioritize = "coalesce(dev, @)"
log = "log"
bookmark-advance-to = 'heads(@- | (@ ~description(exact:"")))'

[revset-aliases]
# utilities
dev = 'coalesce(bookmarks("dev"), description(exact:"dev\n"))'
empty = 'mutable() & empty() & description("") ~@'
firstconflict = "latest(roots(conflicts()))"
'siblings(x)' = "x-+ ~x"
'siblings' = "siblings(@)"
'desc:x' = 'description(regex:x)'

# simpler to type sometimes
me = "@"
this = "@"
par = "@-"

# classes
private = "description(glob:'private:*')"
hidden = "description(glob:'hidden:*')"

# log presets
log = "present(@) | ancestors((builtin_immutable_heads() | trunk()).. ~ hidden, 4) | present(trunk())"
log-ignore = "none"
log-ui = "present(@) | ancestors(builtin_immutable_heads().. ~ hidden, 12) | present(trunk())"
log-unmerged = "present(@) | ancestors(trunk().. ~ hidden, 2) | present(trunk())"


[template-aliases]
nl = '"\n"'

[merge-tools.gitpatch]
program = "sh"
edit-args = [
  "-c",
  '''
  set -eu
  rm -f "$right/JJ-INSTRUCTIONS"
  git -C "$left" init -q
  git -C "$left" add -A
  git -C "$left" commit -q -m baseline --allow-empty
  mv "$left/.git" "$right"
  git -C "$right" add --intent-to-add -A
  git -C "$right" add -p
  git -C "$right" diff-index --quiet --cached HEAD && { echo "No changes done, aborting split."; exit 1; }
  git -C "$right" commit -q -m split
  git -C "$right" restore . # undo changes in modified files
  git -C "$right" reset .   # undo --intent-to-add
  git -C "$right" clean -q -df # remove untracked files
  ''',
]
merge-args = ["-c", "echo gitpatch cannot be used as a merge tool"]
diff-args = ["-c", "echo gitpatch cannot be used as a diff tool"]

[[--scope]]
--when.environments = ["CLAUDECODE"]
--when.commands = ["squash"]
[--scope.ui]
editor = ["sh", "-c", '''
echo >&2
echo "jj wants to open an editor for a commit message, but interactive editors are disabled under Claude Code." >&2
echo "Re-run non-interactively with one of:" >&2
echo "  -m <message>                     set the message explicitly" >&2
echo "  -u / --use-destination-message   reuse the destination message (jj squash)" >&2
echo >&2
exit 1
''']

[[--scope]]
--when.environments = ["CLAUDECODE"]
[--scope.ui]
color = "never"
diff-formatter = ":git"
# Without color the per-workspace `name@` markers are hard to spot, so spell them out.
[--scope.template-aliases]
"builtin_log_oneline(commit)" = '''
if(commit.root(),
  format_root_commit(commit),
  label(
    separate(" ",
      if(commit.current_working_copy(), "working_copy"),
      if(commit.immutable(), "immutable", "mutable"),
      if(commit.conflict(), "conflicted"),
    ),
    separate(" ",
      format_short_change_id_with_change_offset(commit),
      format_short_signature_oneline(commit.author()),
      format_timestamp(commit_timestamp(commit)),
      commit.bookmarks(),
      commit.tags(),
      commit.working_copies().map(|w| "workspace:" ++ w.name()),
      format_short_commit_id(commit.commit_id()),
      format_commit_labels(commit),
      if(config("ui.show-cryptographic-signatures").as_boolean(),
        format_short_cryptographic_signature(commit.signature())
      ),
      if(commit.empty(), empty_commit_marker),
      if(commit.description(),
        commit.description().first_line(),
        label(if(commit.empty(), "empty"), description_placeholder),
      ),
    ) ++ "\n",
  )
)
'''

