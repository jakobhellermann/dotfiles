font=Jetbrains Mono:size=13
initial-window-size-chars=114x26

[colors-dark]
alpha=0.6
background=070707

[scrollback]
lines = 5000

[csd]
preferred = server

[desktop-notifications]
command = fyi --wait --print-id --print-token ${action-argument} ${title} ${body}
command-action-argument = --action ${action-name}:${action-label}
